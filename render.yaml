# tells Render how to run the backend
services:
  - type: web
    name: crk-team-builder-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false        # pasted in the dashboard, never in git
      - key: DATABASE_SSL
        value: "true"      # Neon needs SSL
      - key: JWT_SECRET
        generateValue: true   # Render generates this
